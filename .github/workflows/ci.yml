name: enterprise cloud devops platform

on:
  push:
    branches:
      - main

jobs:
  # =================================================================
  # 1. Frontend CI Job
  # =================================================================
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Download repo code
        uses: actions/checkout@v4

      - name: 2. Setup node version
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 4. Test build application
        working-directory: ./frontend
        run: npm run build

      - name: 5. Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Notice the proper ${{ github.sha }} syntax
      - name: 6. Build and push frontend image (sha + latest)
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/jobportal-web:${{ github.sha }} -t ${{ secrets.DOCKER_USERNAME }}/jobportal-web:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/jobportal-web:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/jobportal-web:latest

  # =================================================================
  # 2. Backend CI Job
  # =================================================================
  backend-ci:
    runs-on: ubuntu-latest
    name: Build and push backend image

    steps:
      - name: 1. Download repo code
        uses: actions/checkout@v4

      - name: 2. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Notice the proper ${{ github.sha }} syntax
      - name: 3. Build and Push Backend Image (sha + latest)
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/jobportal-api:${{ github.sha }} -t ${{ secrets.DOCKER_USERNAME }}/jobportal-api:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/jobportal-api:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/jobportal-api:latest