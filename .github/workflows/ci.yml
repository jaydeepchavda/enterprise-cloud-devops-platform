name: enterprise cloude devops platfform

on:
    push: 
        branches: 
            - main
jobs:
    frontend-ci:
        runs-on: ubuntu-latest

        steps:
            - name: download repo code
              uses: actions/checkout@v4

            - name: setup node version
              uses: actions/setup-node@v4
              with:
                node-version: 20
            
            - name: install dependencies
              working-directory: ./frontend
              run: npm ci
            
            - name: test build application
              working-directory: ./frontend
              run: npm run build 

            - name: docker login
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME}}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: 6. build and push frontend image
              run: |
                docker build -t ${{ secrets.DOCKER_USERNAME }}/jobportal-web:latest ./frontend
                docker push ${{ secrets.DOCKER_USERNAME }}/jobportal-api:latest


    backend-ci:
        runs-on: ubuntu-latest
        name: build and push backend image
        steps:
            - name: 1. download repo code
              uses: actions/checkout@v4
                
            - name: 2. Log in to Docker Hub
              uses: docker/login-action@v3
              with:
               username: ${{ secrets.DOCKER_USERNAME }}
               password: ${{ secrets.DOCKERHUB_TOKEN }}
                
            - name: 3. Build and Push Backend Image
              run: |
                docker build -t ${{ secrets.DOCKER_USERNAME }}/jobportal-api:latest ./backend
                docker push ${{ secrets.DOCKER_USERNAME }}/jobportal-api:latest


                

