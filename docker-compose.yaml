version: '3.8'

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  # 1. Database Tier: PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: jobportal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jobportal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobportal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend API Tier: Node.js Express
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cloudplatform/jobportal-api:1.0.0
    container_name: jobportal-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: jobportal
      JWT_SECRET: devops_super_secret_jwt_key_2026
    ports:
      - "5000:5000"
    networks:
      - app-network
    depends_on:
      postgres-db:
        condition: service_healthy

  # 3. Frontend Web Tier: Vite React + Nginx
  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cloudplatform/jobportal-web:1.0.0
    container_name: jobportal-web
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - backend-api